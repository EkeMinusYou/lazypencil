[package]
name = "lazypencil-shader-preprocessor"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glsl-lang-pp = { version = "=0.8.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[patch.crates-io]
# Prescan function arguments before suppressing recursive replacement expansion.
glsl-lang-pp = { path = "vendor/glsl-lang-pp" }
