[package]
name = "lazypencil"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
description = "A terminal-first .pen design editor, renderer, and MCP server"
license = "MIT"
repository = "https://github.com/EkeMinusYou/lazypencil"
readme = "README.md"

[features]
default = ["rendering", "tui"]
rendering = ["dep:skia-safe"]
tui = ["rendering", "dep:arboard", "dep:crossterm", "dep:ratatui", "dep:ratatui-image", "dep:ratatui-textarea", "dep:image", "dep:shell-words"]

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"], optional = true }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"], optional = true }
ratatui-textarea = { version = "0.9.3", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
shell-words = { version = "1.1.1", optional = true }
agent-client-protocol = "=3.5.0"
futures = "0.3.32"
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.22.1"
directories = "6.0.0"
fs2 = "0.4.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
roxmltree = "=0.21.1"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json", "preserve_order"] }
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
skia-safe = { version = "0.153.3", default-features = false, features = ["binary-cache", "embed-icudtl", "textlayout", "jpeg", "webp-decode"], optional = true }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "signal", "time", "macros", "process", "io-util", "io-std"] }
tokio-util = { version = "0.7.20", features = ["rt", "compat", "codec"] }
uuid = { version = "1.28.0", features = ["v4"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.7"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ctrlc = "3.5.2"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# Level-triggered polling retains unread input when resize and key events overlap.
crossterm = { version = "0.29.0", features = ["use-dev-tty"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "lazypencil"
path = "src/main.rs"

[patch.crates-io]
# Upstream fix for bindgen with macOS 27 / Apple clang 21 (rust-skia #1335).
skia-bindings = { path = "vendor/skia-bindings" }
