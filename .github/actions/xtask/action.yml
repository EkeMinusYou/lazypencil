name: Prepare Rust development tools
description: Build and check the independent tool workspace before native compilation
inputs:
  prebuilt:
    description: Same-run native tool artifact for compiled test consumers
    default: ''
  verify:
    description: Run the tool test and lint gate for this verification job
    default: 'false'
  retire-old-tools:
    description: Retire replaced compatible tool caches after verification with actions write permission
    default: 'false'
  reserve-source-headroom:
    description: Retire obsolete source/download caches before tool publication with actions write permission
    default: 'false'
outputs:
  dependency-key:
    description: Compiler/image/lockfile key for the dependency-only checkpoint
    value: ${{ steps.dependencies.outputs.cache-primary-key }}
  dependency-save-needed:
    description: Retain completed dependencies after the caller finishes using its tool binaries
    value: ${{ inputs.verify != 'true' && steps.build.outcome == 'success' && steps.tools.outputs.cache-matched-key == '' && steps.dependencies.outputs.cache-hit != 'true' && steps.dependencies.outputs.cache-primary-key != '' }}
runs:
  using: composite
  steps:
    - name: Expose the hosted image identity to cache expressions
      shell: bash
      run: printf 'LAZYPENCIL_RUNNER_IMAGE=%s\n' "$ImageVersion" >> "$GITHUB_ENV"
    - name: Install the declared compiler
      shell: bash
      run: |
        rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
        rustup default 1.94.0
    - name: Restore verified executable-only tools for jobs that do not compile them
      id: executables
      if: inputs.prebuilt == '' && runner.os != 'Windows'
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        lookup-only: ${{ inputs.verify == 'true' }}
        path: ${{ runner.temp }}/lazypencil-tools-cache
        key: xtask-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-${{ hashFiles('xtask/**', '!xtask/target/**', '.github/actions/xtask/action.yml', 'vendor/skia-bindings/build_support/binary_cache/source_archive.rs') }}
    - name: Restore tools bound to these sources
      id: tools
      if: inputs.prebuilt == '' && (inputs.verify == 'true' || steps.executables.outputs.cache-hit != 'true')
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: xtask-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-${{ hashFiles('xtask/**', '!xtask/target/**', '.github/actions/xtask/action.yml', 'vendor/skia-bindings/build_support/binary_cache/source_archive.rs') }}
        restore-keys: xtask-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-
    - name: Restore dependency-only bootstrap checkpoints
      id: dependencies
      if: inputs.prebuilt == '' && (inputs.verify == 'true' || steps.executables.outputs.cache-hit != 'true') && steps.tools.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        lookup-only: ${{ steps.tools.outputs.cache-matched-key != '' }}
        path: xtask/target
        key: xtask-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-${{ hashFiles('xtask/Cargo.lock', 'xtask/Cargo.toml') }}
        restore-keys: xtask-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-
    - name: Discard old tool units while retaining Cargo-owned dependencies
      if: inputs.prebuilt == '' && (inputs.verify == 'true' || steps.executables.outputs.cache-hit != 'true') && steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: cargo clean --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --package lazypencil-xtask
    - name: Build the lightweight tools and native fixtures
      id: build
      if: inputs.prebuilt == '' && (inputs.verify == 'true' || steps.executables.outputs.cache-hit != 'true') && steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: cargo build --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --bins
    - name: Download the same run's native tools without the Cargo build tree
      if: inputs.prebuilt != ''
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        name: ${{ inputs.prebuilt }}
        path: xtask/target/debug
    - name: Verify native tool bytes before executing them
      if: inputs.prebuilt != '' || inputs.verify != 'true' && steps.executables.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.prebuilt != '' && 'xtask/target/debug' || format('{0}/lazypencil-tools-cache', runner.temp) }}
      run: |
        shasum -a 256 --check SHA256SUMS
        chmod +x xtask lazypencil-test-helper
    - name: Install verified cached executables without a Cargo build tree
      if: inputs.prebuilt == '' && inputs.verify != 'true' && steps.executables.outputs.cache-hit == 'true'
      shell: bash
      run: |
        "$RUNNER_TEMP/lazypencil-tools-cache/xtask" ci tools stage --output xtask/target/debug
        chmod +x xtask/target/debug/xtask xtask/target/debug/lazypencil-test-helper
    - name: Prepare isolated test paths and source freshness
      shell: bash
      run: xtask/target/debug/xtask ci tools prepare
    - name: Verify Rust tools before application builds
      if: inputs.verify == 'true'
      shell: bash
      run: xtask/target/debug/xtask ci tools verify
    - name: Retire superseded compatible tool sources after verification
      if: inputs.retire-old-tools == 'true' && inputs.verify == 'true' && github.ref == 'refs/heads/main'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: xtask/target/debug/xtask ci cache retain --delete --before-tools-replacement '${{ steps.tools.outputs.cache-primary-key }}' --tools-matched-key '${{ steps.tools.outputs.cache-matched-key }}'
    - name: Verify source inputs before reserving publication headroom
      id: source-headroom
      if: inputs.reserve-source-headroom == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: xtask/target/debug/xtask ci native source
    - name: Retire obsolete sources and duplicate downloads before publishing tools
      if: steps.source-headroom.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: xtask/target/debug/xtask ci cache retain --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
    - name: Save verified source-bound tools
      if: inputs.verify == 'true' && steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - name: Stage verified tool executables without the Cargo tree
      id: executable-manifest
      if: inputs.verify == 'true' && runner.os != 'Windows' && steps.executables.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: xtask/target/debug/xtask ci tools stage --output "$RUNNER_TEMP/lazypencil-tools-cache"
    - name: Publish verified executable-only tools for execution jobs
      id: executable-published
      if: steps.executable-manifest.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.executables.outputs.cache-primary-key }}
        path: ${{ runner.temp }}/lazypencil-tools-cache
    - name: Retire replaced executable-only sources after verification
      if: inputs.retire-old-tools == 'true' && inputs.verify == 'true' && github.ref == 'refs/heads/main' && (steps.executable-published.outcome == 'success' || steps.executables.outputs.cache-hit == 'true')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: xtask/target/debug/xtask ci cache retain --delete --before-tools-replacement '${{ steps.executables.outputs.cache-primary-key }}' --tools-matched-key '${{ steps.executables.outputs.cache-primary-key }}'
    - name: Keep completed dependencies when the tool gate fails
      id: failed-dependencies
      if: ${{ failure() && steps.build.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: cargo clean --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --package lazypencil-xtask
    - name: Save the failed gate dependency checkpoint
      if: ${{ failure() && steps.failed-dependencies.outcome == 'success' && github.ref == 'refs/heads/main' }}
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
