name: Prepare Rust development tools
description: Build and check the independent tool workspace before native compilation
inputs:
  verify:
    description: Run the tool test and lint gate for this verification job
    default: 'false'
  retire-old-tools:
    description: Retire replaced compatible tool caches after verification with actions write permission
    default: 'false'
  reserve-source-headroom:
    description: Retire obsolete source/download caches before tool publication with actions write permission
    default: 'false'
runs:
  using: composite
  steps:
    - name: Expose the hosted image identity to cache expressions
      shell: bash
      run: printf 'LAZYPENCIL_RUNNER_IMAGE=%s\n' "$ImageVersion" >> "$GITHUB_ENV"
    - name: Install the declared compiler
      shell: bash
      run: |
        rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
        rustup default 1.94.0
    - name: Restore tools bound to these sources
      id: tools
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: xtask-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-${{ hashFiles('xtask/**', '!xtask/target/**', '.github/actions/xtask/action.yml') }}
        restore-keys: xtask-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-
    - name: Restore dependencies retained from a failed tool gate
      id: dependencies
      if: steps.tools.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: xtask-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-${{ hashFiles('xtask/Cargo.lock', 'xtask/Cargo.toml') }}
        restore-keys: xtask-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LAZYPENCIL_RUNNER_IMAGE }}-rust1.94.0-
    - name: Discard old tool units while retaining Cargo-owned dependencies
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: cargo clean --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --package lazypencil-xtask
    - name: Build the lightweight tools and native fixtures
      id: build
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: cargo build --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --bins
    - name: Prepare isolated test paths and source freshness
      shell: bash
      run: xtask/target/debug/xtask ci tools prepare
    - name: Verify Rust tools before application builds
      if: inputs.verify == 'true'
      shell: bash
      run: cargo xtask ci tools verify
    - name: Retire superseded compatible tool sources after verification
      if: inputs.retire-old-tools == 'true' && inputs.verify == 'true' && github.ref == 'refs/heads/main'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: cargo xtask ci cache retain --delete --before-tools-replacement '${{ steps.tools.outputs.cache-primary-key }}' --tools-matched-key '${{ steps.tools.outputs.cache-matched-key }}'
    - name: Verify source inputs before reserving publication headroom
      id: source-headroom
      if: inputs.reserve-source-headroom == 'true' && inputs.verify == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: cargo xtask ci native source
    - name: Retire obsolete sources and duplicate downloads before publishing tools
      if: steps.source-headroom.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: cargo xtask ci cache retain --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
    # Native jobs compile the same source-bound tools on their own OS. Preserve
    # that build for the next job too; the plan job still owns the full tool gate.
    - name: Save source-bound tools after successful preparation
      if: success() && steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - name: Keep completed dependencies when the tool gate fails
      id: failed-dependencies
      if: ${{ failure() && steps.build.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: cargo clean --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target --package lazypencil-xtask
    - name: Save the failed gate dependency checkpoint
      if: ${{ failure() && steps.failed-dependencies.outcome == 'success' && github.ref == 'refs/heads/main' }}
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: xtask/target
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
