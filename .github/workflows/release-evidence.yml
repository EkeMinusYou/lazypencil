name: Release build evidence
on:
  workflow_dispatch:
    inputs:
      os:
        description: Hosted platform for source-bound release evidence
        type: choice
        default: ubuntu-24.04-arm
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      measure_tui:
        description: Measure the packaged TUI after all builds and other checks finish
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-evidence-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  evidence:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Install original compiler copyright documentation
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-docs
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo xtask ci linux-dependencies
      - name: Restore verified Cargo downloads
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify and extract the complete source distribution
        run: cargo xtask ci native source
      - name: Identify compatible native dependency caches
        id: cache-key
        continue-on-error: true
        run: cargo xtask ci cache native --platform '${{ inputs.os }}' --image "$ImageVersion"
      - name: Restore dependencies from native verification
        if: steps.cache-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-key.outputs.primary }}
          restore-keys: |
            ${{ format('checkpoint-{0}-', steps.cache-key.outputs.primary) }}
            ${{ format('checkpoint-{0}', steps.cache-key.outputs.primary) }}
            ${{ steps.cache-key.outputs.legacy }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
      - name: Prepare original standard-library evidence
        run: cargo xtask ci toolchain-evidence --output "$RUNNER_TEMP/toolchain-evidence"
      - name: Remove application outputs from dependency fallback caches
        run: cargo xtask ci cache prune --source "$RUNNER_TEMP/lazypencil-source"
      - name: Identify source-bound application outputs
        id: application-key
        if: steps.cache-key.outcome == 'success'
        continue-on-error: true
        run: cargo xtask ci cache application identify --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Restore source-bound application outputs
        if: steps.application-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.primary }}
          restore-keys: |
            ${{ steps.application-key.outputs.checkpoint_prefix }}
            ${{ steps.application-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-application-cache
      - name: Validate application reuse or keep a fresh build
        if: steps.application-key.outcome == 'success'
        timeout-minutes: 3
        run: cargo xtask ci cache application restore-or-prune --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Compile the release executable and record selected Cargo artifacts
        run: cargo xtask ci native evidence-build
      - name: Collect and reverify original notices against this build
        id: notices
        run: cargo xtask evidence --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --cargo-json "$RUNNER_TEMP/release-cargo.jsonl" --revision '${{ github.sha }}' --output "$RUNNER_TEMP/release-evidence" --toolchain-evidence "$RUNNER_TEMP/toolchain-evidence" --link-map "$CARGO_TARGET_DIR/release/lazypencil.map"
      - name: Package and smoke the source-bound binary candidate
        timeout-minutes: 10
        run: cargo xtask ci native candidate
      - name: Retain the verified candidate and isolated smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binary-candidate-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lazypencil-candidate.tar.gz
            ${{ runner.temp }}/candidate-smoke.json
            ${{ runner.temp }}/candidate-smoke.png
          if-no-files-found: error
          retention-days: 3
      - name: Retain review evidence without publishing the executable
        if: ${{ !cancelled() && steps.notices.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Install real Linux terminal emulators
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo xtask ci linux-terminal-dependencies
      - name: Verify actual Kitty and Sixel window pixels and keyboard operations
        id: terminal-test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo xtask terminal --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/terminal-evidence"
      - name: Retain real-emulator screenshots and source-bound report
        if: ${{ always() && (steps.terminal-test.outcome == 'success' || steps.terminal-test.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terminal-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Attest the verified candidate archive
        id: candidate-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/lazypencil-candidate.tar.gz
          create-storage-record: false
      - name: Verify the candidate signer workflow and source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci provenance --kind candidate --artifact "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/candidate-provenance/verification.json"
      - name: Retain the signed candidate provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-provenance-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.candidate-attestation.outputs.bundle-path }}
            ${{ runner.temp }}/candidate-provenance
          if-no-files-found: error
          retention-days: 3
      - name: Measure source-bound TUI input, output and idle resources
        id: tui-measurement
        if: inputs.measure_tui
        timeout-minutes: 15
        run: cargo xtask measure-tui --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/tui-measurement"
      - name: Retain TUI measurements and diagnostic logs
        if: ${{ always() && (steps.tui-measurement.outcome == 'success' || steps.tui-measurement.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tui-measurement-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-measurement
          if-no-files-found: error
          retention-days: 3
