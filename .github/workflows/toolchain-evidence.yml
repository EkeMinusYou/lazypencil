name: Standard-library notice evidence
on:
  workflow_dispatch:
    inputs:
      os:
        description: Mac toolchain evidence; Linux choices are deferred-platform diagnostics
        type: choice
        default: macos-15
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
permissions:
  contents: read
concurrency:
  group: toolchain-evidence-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  toolchain:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Install original copyright documentation
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-docs
      - name: Verify pinned standard-library supplements
        run: xtask/target/debug/xtask notices toolchain verify-upstream --upstream resources/licenses/toolchain/upstream.json
      - name: Reconstruct installed library evidence from pinned original sources
        run: xtask/target/debug/xtask ci toolchain-evidence --output "$RUNNER_TEMP/toolchain-evidence"
      - name: Retain small notice evidence without source trees or compiler binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: toolchain-evidence-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/toolchain-evidence
          if-no-files-found: error
          retention-days: 3
