name: Hosted native verification

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      phase:
        type: string
        default: full
      lane:
        type: string
        default: all
      suite:
        type: string
        default: core
      targets:
        type: string
        default: '["document_store", "mcp"]'
      measure_tui:
        type: boolean
        default: false
      native_clipboard:
        type: boolean
        default: false
      terminal_reproduction:
        type: boolean
        default: false
      runtime_parallel:
        type: boolean
        default: false
      focused_application:
        type: string
        default: ''
      rebuild_application:
        type: boolean
        default: false
    outputs:
      application_artifact:
        value: ${{ jobs.verify.outputs.application_artifact }}
      binaries_artifact:
        value: ${{ jobs.verify.outputs.binaries_artifact }}
      runtime_binaries_artifact:
        value: ${{ jobs.verify.outputs.runtime_binaries_artifact }}
      terminal_binaries_artifact:
        value: ${{ jobs.verify.outputs.terminal_binaries_artifact }}
      material_binaries_artifact:
        value: ${{ jobs.verify.outputs.material_binaries_artifact }}
      native_tools_artifact:
        value: ${{ jobs.verify.outputs.native_tools_artifact }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  ci-checks:
    name: Check changed CI and distribution inputs
    if: inputs.phase == 'focus' && inputs.suite == 'ci'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: ${{ inputs.lane == 'all' || inputs.lane == 'core' }}
      - name: Verify the current source distribution
        run: cargo xtask ci native source

  verify:
    outputs:
      application_artifact: ${{ steps.application-artifact-upload.outcome == 'success' && steps.application-key.outputs.checkpoint_legacy || '' }}
      binaries_artifact: ${{ steps.binaries-upload.outcome == 'success' && format('native-executables-{0}', github.sha) || '' }}
      runtime_binaries_artifact: ${{ steps.runtime-binaries-upload.outcome == 'success' && format('native-runtime-executables-{0}', github.sha) || '' }}
      terminal_binaries_artifact: ${{ steps.terminal-binaries-upload.outcome == 'success' && format('native-terminal-executables-{0}', github.sha) || '' }}
      material_binaries_artifact: ${{ steps.material-binaries-upload.outcome == 'success' && format('native-material-executables-{0}', github.sha) || '' }}
      native_tools_artifact: ${{ steps.native-tools-upload.outcome == 'success' && format('native-tools-{0}', github.sha) || '' }}
    permissions:
      contents: read
      actions: write
    if: inputs.phase != 'focus' || inputs.suite != 'ci'
    timeout-minutes: ${{ inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation') && 30 || 60 }}
    runs-on: ${{ inputs.os }}
    env:
      LAZYPENCIL_CI_TEST_PROFILE: optimized-debug-v1
      # The combined Mac pipeline already runs the complete core configuration.
      LAZYPENCIL_CI_SEPARATE_CORE: ${{ inputs.lane == 'build' }}
      FOCUS_SUITE: ${{ inputs.suite }}
      FOCUS_TARGETS: ${{ inputs.targets }}
      CORE_ONLY_CACHE: ${{ inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation') }}
      RUNTIME_PARALLEL: ${{ inputs.runtime_parallel }}
      HEADED_BROWSER_TESTS: ${{ inputs.lane == 'default' || inputs.lane == 'all' && (inputs.phase == 'full' || inputs.runtime_parallel || contains(fromJSON(inputs.targets), 'browser_readiness')) }}
      FOCUS_RUNTIME_STAGE: ${{ (inputs.suite == 'release' || inputs.suite == 'candidate' || inputs.measure_tui) && 'focus-runtime-release' || 'runtime-tests' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: ${{ inputs.lane == 'all' || inputs.lane == 'core' }}
          retire-old-tools: 'true'
      - name: Cache verified Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'xtask/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux' && (inputs.phase == 'full' || inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel || (inputs.suite != 'core' && inputs.suite != 'conversation'))
        timeout-minutes: 20
        run: cargo xtask ci linux-dependencies
      - name: Verify, extract and normalize the complete source distribution
        run: cargo xtask ci native source
      - name: Restore immutable upstream emoji fixtures
        id: emoji-cache
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus' || contains(fromJSON(inputs.targets), 'font_sources')) }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: emoji-fonts-v1-${{ hashFiles('tests/fixtures/fonts/emoji-upstream.json') }}
          path: |
            ${{ runner.temp }}/emoji-fonts/LICENSE
            ${{ runner.temp }}/emoji-fonts/NotoColorEmoji.ttf
            ${{ runner.temp }}/emoji-fonts/Noto-COLRv1.ttf
      - name: Verify pinned emoji bytes before native compilation
        id: emoji-prepare
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus' || contains(fromJSON(inputs.targets), 'font_sources')) }}
        timeout-minutes: 20
        run: cargo xtask fixtures emoji --output "$RUNNER_TEMP/emoji-fonts"
      - name: Save only verified original emoji inputs
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (github.ref == 'refs/heads/main' && steps.emoji-prepare.outcome == 'success' && steps.emoji-cache.outputs.cache-hit != 'true') }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.emoji-cache.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/emoji-fonts/LICENSE
            ${{ runner.temp }}/emoji-fonts/NotoColorEmoji.ttf
            ${{ runner.temp }}/emoji-fonts/Noto-COLRv1.ttf
      - name: Identify compatible hosted dependency caches
        id: cache-key
        continue-on-error: true
        run: cargo xtask ci cache native --platform '${{ inputs.os }}' --image "$ImageVersion" --phase '${{ inputs.phase == 'verify' && 'full' || inputs.phase }}' --core-only "$CORE_ONLY_CACHE"
      - name: Restore hosted dependency build artifacts
        id: native-cache
        if: steps.cache-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-key.outputs.preferred }}
          restore-keys: |
            ${{ steps.cache-key.outputs.complete }}
            ${{ steps.cache-key.outputs.primary }}
            ${{ format('checkpoint-{0}-', steps.cache-key.outputs.primary) }}
            ${{ format('checkpoint-{0}', steps.cache-key.outputs.primary) }}
            ${{ steps.cache-key.outputs.legacy }}
            ${{ inputs.phase == 'full' && format('core-{0}', steps.cache-key.outputs.primary) || '' }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
      - name: Remove application outputs from dependency fallback caches
        run: cargo xtask ci cache prune --source "$RUNNER_TEMP/lazypencil-source"
      - name: Identify source-bound application outputs
        id: application-key
        if: steps.cache-key.outcome == 'success' && inputs.lane != 'release'
        continue-on-error: true
        run: cargo xtask ci cache application identify --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --native-key '${{ steps.cache-key.outputs.primary }}${{ inputs.lane == 'core' && '-core' || '' }}'
      - name: Download this run's matching focused build
        id: application-artifact
        if: ${{ !inputs.rebuild_application && inputs.phase == 'full' && inputs.focused_application != '' && inputs.focused_application == steps.application-key.outputs.checkpoint_legacy }}
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.focused_application }}
          path: ${{ runner.temp }}/lazypencil-application-transport
      - name: Unpack focused outputs before compiler input verification
        id: application-artifact-extract
        if: steps.application-artifact.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: cargo xtask ci cache artifact unpack --archive "$RUNNER_TEMP/lazypencil-application-transport/checkpoint.tar.gz" --directory "$RUNNER_TEMP/lazypencil-application-cache"
      - name: Restore source-bound application outputs
        id: application-cache
        if: ${{ steps.application-key.outcome == 'success' && steps.application-artifact-extract.outcome != 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.primary }}
          restore-keys: |
            ${{ steps.application-key.outputs.checkpoint_prefix }}
            ${{ steps.application-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-application-cache
          lookup-only: ${{ inputs.rebuild_application }}
      - name: Restore unchanged integration-test outputs from a full build
        id: compatible-cache
        if: steps.application-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.compatible_primary }}
          restore-keys: |
            ${{ steps.application-key.outputs.compatible_prefix }}
            ${{ steps.application-key.outputs.legacy_compatible_primary }}
            ${{ steps.application-key.outputs.legacy_compatible_prefix }}
            ${{ steps.application-key.outputs.previous_debug_primary }}
            ${{ steps.application-key.outputs.previous_debug_prefix }}
            ${{ steps.application-key.outputs.previous_legacy_primary }}
            ${{ steps.application-key.outputs.previous_legacy_prefix }}
          path: ${{ runner.temp }}/lazypencil-compatible-cache
          lookup-only: ${{ inputs.rebuild_application || steps.application-cache.outputs.cache-hit == 'true' }}
      - name: Validate application reuse or keep a fresh build
        id: application-reuse
        if: steps.application-key.outcome == 'success'
        timeout-minutes: 3
        run: cargo xtask ci cache application restore-compatible --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --compatible-directory "$RUNNER_TEMP/lazypencil-compatible-cache" --matched-key '${{ steps.compatible-cache.outputs.cache-matched-key }}' --native-key '${{ steps.cache-key.outputs.primary }}${{ inputs.lane == 'core' && '-core' || '' }}'
      - name: Identify release outputs independently of test changes
        id: release-key
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (steps.cache-key.outcome == 'success' && (inputs.phase != 'focus' || inputs.suite == 'release' || inputs.suite == 'candidate' || inputs.measure_tui)) }}
        continue-on-error: true
        run: cargo xtask ci cache application identify --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Restore compatible mapped release outputs
        id: release-cache
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (steps.release-key.outcome == 'success') }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.release-key.outputs.primary }}
          restore-keys: |
            ${{ steps.release-key.outputs.checkpoint_prefix }}
            ${{ steps.release-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-release-cache
          lookup-only: ${{ inputs.rebuild_application || steps.application-reuse.outputs.release_reused == 'true' }}
      - name: Validate release reuse while keeping verified test outputs
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (steps.release-key.outcome == 'success' && steps.application-reuse.outputs.release_reused != 'true') }}
        timeout-minutes: 3
        run: cargo xtask ci cache application restore-or-prune --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Verify distributed dependency notices
        run: cargo xtask ci native notices
      - name: Reproduce script compatibility before native rendering
        if: (inputs.phase == 'focus' || inputs.phase == 'verify') && inputs.suite != 'ci' && inputs.lane != 'build'
        run: cargo xtask ci native focus-core --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Check affected code and build tests with cache-aware ordering
        id: focus-build
        if: inputs.phase == 'focus'
        timeout-minutes: ${{ (inputs.suite == 'core' || inputs.suite == 'conversation') && 21 || 51 }}
        env:
          NATIVE_CACHE_MATCH: ${{ steps.native-cache.outputs.cache-matched-key }}
        run: cargo xtask ci native focus-prepare --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Prepare affected feature configurations in the combined job
        # Scheduler changes consume the full catalog below; avoid publishing it
        # twice before the same complete suite. Standalone focus keeps its build.
        if: inputs.phase == 'verify' && inputs.lane != 'build' && inputs.suite != 'ci' && inputs.suite != 'normal-ci' && inputs.suite != 'browser-ci'
        run: cargo xtask ci native focus-build --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce affected failures before other tests and Chromium
        if: (inputs.phase == 'focus' || inputs.phase == 'verify' && inputs.lane != 'build') && inputs.suite != 'ci'
        run: cargo xtask ci native focus-reproduce --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce changed native clipboard input before longer tests
        id: native-clipboard-focus
        if: inputs.phase == 'focus' && inputs.native_clipboard
        timeout-minutes: 10
        run: cargo xtask ci native clipboard
      - name: Build core test binaries
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'core') && (inputs.phase != 'focus') }}
        timeout-minutes: 40
        run: cargo xtask ci native core-build
      - name: Test core configuration
        id: core-tests
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'core') && (inputs.phase != 'focus') }}
        timeout-minutes: 15
        run: cargo xtask ci native core-test
      - name: Publish failed core evidence before longer checks
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'core') && (failure() && inputs.phase != 'focus' && steps.core-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-failure-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lazypencil-tests.log
            ${{ runner.temp }}/core-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Check all core targets
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'core') && (inputs.phase != 'focus') }}
        timeout-minutes: 15
        run: cargo xtask ci native core-lint
      - name: Build default tests and record executable identities
        id: default-build
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default' || inputs.lane == 'build') && (inputs.phase != 'focus') }}
        timeout-minutes: ${{ inputs.lane == 'build' && inputs.phase == 'verify' && 60 || 45 }}
        run: cargo xtask ci native '${{ inputs.lane == 'build' && inputs.phase == 'verify' && 'build-and-reproduce' || 'default-build' }}' --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce real emoji, TUI and isolated MCP cancellation first
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus') }}
        run: cargo xtask ci native reproduce
      - name: Install real Linux terminal emulators for the early reproduction
        if: runner.os == 'Linux' && (inputs.terminal_reproduction || inputs.phase == 'focus' && inputs.suite == 'candidate')
        timeout-minutes: 20
        run: cargo xtask ci linux-terminal-dependencies
      - name: Reproduce real terminal pixels with the existing verified debug build
        id: terminal-reproduction
        if: runner.os == 'Linux' && (inputs.terminal_reproduction || inputs.phase == 'focus' && inputs.suite == 'candidate')
        timeout-minutes: 10
        run: cargo xtask terminal --development-build --output "$RUNNER_TEMP/terminal-reproduction"
      - name: Retain early real-terminal reproduction evidence
        if: ${{ always() && (steps.terminal-reproduction.outcome == 'success' || steps.terminal-reproduction.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terminal-reproduction-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-reproduction
          if-no-files-found: error
          retention-days: 3
      - name: Check all default targets independently of compiled test consumers
        # The independent core host owns this check on the initial Mac target.
        # Publishing executables does not need to wait for Clippy; the final
        # workflow gate still requires both hosts to succeed.
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default' || inputs.lane == 'core' && runner.os == 'macOS') && (inputs.phase != 'focus') }}
        timeout-minutes: 15
        run: cargo xtask ci native default-lint
      - name: Verify normal default-feature development compilation on the independent core host
        if: inputs.lane == 'core' && runner.os == 'macOS' && inputs.phase != 'focus'
        timeout-minutes: 45
        run: cargo xtask ci native default-development-build
      - name: Stage same-run native tools for consumers
        if: inputs.lane == 'build'
        run: cargo xtask ci tools stage --output "$RUNNER_TEMP/native-tools"
      - name: Share tools without their Cargo build tree
        id: native-tools-upload
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-tools-${{ github.sha }}
          path: ${{ runner.temp }}/native-tools/
          compression-level: 1
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Complete Cargo-owned checks and stage the immutable executable catalog
        if: inputs.lane == 'build'
        run: cargo xtask ci native binaries-stage
      - name: Share executables without duplicating the complete Cargo checkpoint
        id: binaries-upload
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-executables-${{ github.sha }}
          path: ${{ runner.temp }}/native-binaries/catalog.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Share only the executable targets used by runtime verification
        id: runtime-binaries-upload
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-runtime-executables-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-binaries/catalog.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Share terminal checks without unrelated executables
        id: terminal-binaries-upload
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-terminal-executables-${{ github.sha }}
          path: ${{ runner.temp }}/native-terminal-binaries/catalog.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Share Material checks without unrelated executables
        id: material-binaries-upload
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-material-executables-${{ github.sha }}
          path: ${{ runner.temp }}/native-material-binaries/catalog.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Compile the isolated release lane
        id: release-build
        if: inputs.lane == 'release'
        run: cargo xtask ci native focus-release
      - name: Install and diagnose the verified sandboxed Chromium runtime
        if: inputs.lane == 'default' || inputs.lane == 'release' && inputs.measure_tui || inputs.lane == 'all' && (inputs.phase == 'full' || inputs.measure_tui || inputs.runtime_parallel || inputs.suite == 'dynamic' || inputs.suite == 'shader' || inputs.suite == 'copy' || inputs.suite == 'browser' || inputs.suite == 'browser-ci' || inputs.suite == 'render' || (inputs.suite == 'candidate' && contains(fromJSON(inputs.targets), 'dynamic_render')))
        timeout-minutes: 15
        run: cargo xtask ci native browser-setup --suite "${{ inputs.lane == 'release' && 'release' || inputs.lane != 'all' && 'pipeline' || inputs.suite }}"
      - name: Verify fixture-owned native clipboard images and actual Ctrl+V delivery
        id: native-clipboard
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus') }}
        timeout-minutes: 10
        run: cargo xtask ci native clipboard
      - name: Retain native clipboard and PTY evidence
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (always() && (steps.native-clipboard.outcome == 'success' || steps.native-clipboard.outcome == 'failure' || steps.native-clipboard-focus.outcome == 'success' || steps.native-clipboard-focus.outcome == 'failure')) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.phase }}-clipboard-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clipboard-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Run independent default and runtime tests before their shared evidence gate
        id: default-release
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus') }}
        timeout-minutes: 60
        run: cargo xtask ci native "${{ inputs.lane == 'all' && 'default-release' || 'complete-tests' }}"
      - name: Run affected tests and pixel reproductions
        if: inputs.phase == 'focus'
        timeout-minutes: ${{ inputs.suite == 'normal-ci' && 60 || inputs.suite == 'browser-ci' && 25 || 10 }}
        run: cargo xtask ci native focus-test --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Verify runtime scheduling with the selected build stage
        if: inputs.phase == 'focus' && inputs.runtime_parallel
        timeout-minutes: 60
        run: cargo xtask ci native "$FOCUS_RUNTIME_STAGE" --suite focus
      - name: Verify changed release build recipe before the full matrix
        id: focus-release
        if: inputs.phase == 'focus' && (inputs.suite == 'release' || inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 60
        run: cargo xtask ci native focus-release
      - name: Prepare source-bound original notices for the candidate
        if: (inputs.phase == 'focus' || inputs.lane == 'release') && (inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 20
        run: cargo xtask ci native candidate-prepare
      - name: Verify the isolated binary candidate before the full matrix
        if: (inputs.phase == 'focus' || inputs.lane == 'release') && (inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 10
        run: cargo xtask ci native candidate
      - name: Retain the focused binary candidate and isolated smoke proof
        if: (inputs.phase == 'focus' || inputs.lane == 'release') && (inputs.suite == 'candidate' || inputs.measure_tui)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: focus-candidate-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lazypencil-candidate.tar.gz
            ${{ runner.temp }}/candidate-smoke.json
            ${{ runner.temp }}/candidate-smoke.png
          if-no-files-found: error
          retention-days: 3
      - name: Verify independent browser, MCP, lifecycle and Material suites
        if: inputs.lane == 'all' && inputs.phase == 'full'
        timeout-minutes: 60
        run: cargo xtask ci native runtime-tests
      - name: Verify packaged real-terminal pixels and keyboard operations
        id: terminal-test
        if: runner.os == 'Linux' && inputs.phase == 'focus' && inputs.suite == 'candidate'
        timeout-minutes: 10
        run: cargo xtask terminal --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/terminal-evidence"
      - name: Retain the real-emulator screenshots and source-bound report
        if: ${{ always() && (steps.terminal-test.outcome == 'success' || steps.terminal-test.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terminal-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Measure changed TUI performance code before the full matrix
        id: tui-measurement
        if: (inputs.phase == 'focus' || inputs.lane == 'release') && inputs.measure_tui
        timeout-minutes: 15
        run: cargo xtask measure-tui --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/tui-measurement" --chromium-resources --enforce-memory-target
      - name: Retain focused TUI measurements and diagnostic logs
        if: ${{ always() && (steps.tui-measurement.outcome == 'success' || steps.tui-measurement.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tui-measurement-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-measurement
          if-no-files-found: error
          retention-days: 3
      - name: Render the combined example for review
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'default') && (inputs.phase != 'focus') }}
        run: cargo xtask ci native panel
      - name: Recheck release inputs and run isolated smoke tests and measurements
        id: release-smoke
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (inputs.phase != 'focus') }}
        run: cargo xtask ci native release
      - name: Retain source-bound logs and rendered evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.phase != 'focus' && 'verification' || 'focus' }}-${{ inputs.lane != 'all' && format('{0}-', inputs.lane) || '' }}${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ci-timings.jsonl
            ${{ runner.temp }}/test-executables.json
            ${{ runner.temp }}/default-build.jsonl
            ${{ runner.temp }}/tui-artifacts/
            ${{ runner.temp }}/render-regressions/
            ${{ runner.temp }}/chromium-*.json
            ${{ runner.temp }}/chromium-*.png
            ${{ runner.temp }}/chromium-userns.apparmor
            ${{ runner.temp }}/chromium-ui-userns.apparmor
            ${{ runner.temp }}/codec-reference/codec-*
            ${{ runner.temp }}/lazypencil-target/release-*.json
            ${{ runner.temp }}/lazypencil-target/release-*.png
            ${{ runner.temp }}/release-linkage/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage verified application outputs for reuse
        id: application-save
        if: ${{ !cancelled() && inputs.phase == 'focus' && (success() || steps.focus-build.outcome == 'success' && steps.focus-release.outcome == 'success') && steps.application-key.outcome == 'success' && steps.application-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage-focused --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --compatible-directory "$RUNNER_TEMP/lazypencil-compatible-cache" --matched-key '${{ steps.compatible-cache.outputs.cache-matched-key }}' --native-key '${{ steps.cache-key.outputs.primary }}${{ inputs.lane == 'core' && '-core' || '' }}'
      - name: Archive focused outputs without changing Cargo file times
        id: application-artifact-pack
        if: ${{ !cancelled() && steps.application-save.outcome == 'success' && steps.application-save.outputs.staged == 'true' }}
        continue-on-error: true
        timeout-minutes: 12
        run: cargo xtask ci cache artifact pack --directory "$RUNNER_TEMP/lazypencil-application-cache" --archive "$RUNNER_TEMP/lazypencil-application-transport/checkpoint.tar.gz"
      - name: Share this run's verified focused outputs
        id: application-artifact-upload
        if: ${{ !cancelled() && steps.application-artifact-pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.application-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-application-transport/checkpoint.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Stage mapped release outputs independently of tests
        id: release-save
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (!cancelled() && steps.release-key.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true' && (steps.release-smoke.outcome == 'success' || steps.focus-release.outcome == 'success' || steps.default-release.outcome == 'success') && github.ref == 'refs/heads/main') }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Save the verified release checkpoint
        if: ${{ (inputs.lane == 'all' || inputs.lane == 'release') && (!cancelled() && steps.release-save.outcome == 'success') }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ inputs.phase != 'focus' && steps.release-key.outputs.primary || steps.release-key.outputs.checkpoint }}
          path: ${{ runner.temp }}/lazypencil-release-cache
      - name: Stage a complete build for unchanged integration-test reuse
        id: compatible-save
        if: ${{ (inputs.lane != 'release') && !cancelled() && (success() || steps.default-build.outputs.compiled_catalog == github.sha) && inputs.phase != 'focus' && steps.application-key.outcome == 'success' && steps.compatible-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-compatible-cache" --native-key '${{ steps.cache-key.outputs.primary }}${{ inputs.lane == 'core' && '-core' || '' }}'
      - name: Reserve room for the staged successful replacement
        if: ${{ (inputs.lane != 'release') && !cancelled() && steps.compatible-save.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --before-replacement --platform '${{ inputs.os }}' --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
      - name: Save the complete integration-test checkpoint
        id: compatible-published
        if: ${{ (inputs.lane != 'release') && !cancelled() && steps.compatible-save.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.compatible_primary }}
          path: ${{ runner.temp }}/lazypencil-compatible-cache
      - name: Retire superseded checkpoints after publication
        if: ${{ (inputs.lane != 'release') && !cancelled() && steps.compatible-published.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --platform '${{ inputs.os }}' --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
      - name: Keep completed dependencies after failure or cancellation
        id: cache-prune
        if: ${{ always() && steps.native-cache.outcome == 'success' && (steps.focus-build.outcome == 'success' || steps.default-build.outcome == 'success' || steps.default-build.outputs.compiled_catalog == github.sha || steps.release-build.outcome == 'success') }}
        continue-on-error: true
        run: cargo xtask ci cache native-checkpoint --primary '${{ steps.cache-key.outputs.primary }}' --checkpoint '${{ steps.cache-key.outputs.checkpoint }}' --matched-key '${{ steps.native-cache.outputs.cache-matched-key }}' --core-only "$CORE_ONLY_CACHE" --complete-catalog '${{ steps.default-build.outputs.compiled_catalog }}' --release-verified '${{ inputs.phase == 'full' && steps.release-smoke.outcome == 'success' }}' --source "$RUNNER_TEMP/lazypencil-source"
      - name: Save compatible hosted dependency build artifacts
        id: native-published
        if: ${{ always() && steps.cache-prune.outcome == 'success' && steps.cache-prune.outputs.save_key != '' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-prune.outputs.save_key }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
      - name: Retire the release baseline only after its extended graph exists
        if: ${{ always() && steps.native-published.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
