name: Hosted native verification

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      phase:
        type: string
        default: full
      suite:
        type: string
        default: core
      targets:
        type: string
        default: '["document_store", "mcp"]'
      measure_tui:
        type: boolean
        default: false
      native_clipboard:
        type: boolean
        default: false
      runtime_parallel:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  ci-checks:
    name: Check changed CI and distribution inputs
    if: inputs.phase == 'focus' && inputs.suite == 'ci'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Verify the current source distribution
        run: cargo xtask ci native source

  verify:
    permissions:
      contents: read
      actions: write
    if: inputs.phase != 'focus' || inputs.suite != 'ci'
    timeout-minutes: ${{ inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation') && 30 || 60 }}
    runs-on: ${{ inputs.os }}
    env:
      FOCUS_SUITE: ${{ inputs.suite }}
      FOCUS_TARGETS: ${{ inputs.targets }}
      RUNTIME_PARALLEL: ${{ inputs.runtime_parallel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Cache verified Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'xtask/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux' && (inputs.phase == 'full' || inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel || (inputs.suite != 'core' && inputs.suite != 'conversation'))
        timeout-minutes: 20
        run: cargo xtask ci linux-dependencies
      - name: Verify, extract and normalize the complete source distribution
        run: cargo xtask ci native source
      - name: Restore immutable upstream emoji fixtures
        id: emoji-cache
        if: inputs.phase == 'full' || contains(fromJSON(inputs.targets), 'font_sources')
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: emoji-fonts-v1-${{ hashFiles('tests/fixtures/fonts/emoji-upstream.json') }}
          path: |
            ${{ runner.temp }}/emoji-fonts/LICENSE
            ${{ runner.temp }}/emoji-fonts/NotoColorEmoji.ttf
            ${{ runner.temp }}/emoji-fonts/Noto-COLRv1.ttf
      - name: Verify pinned emoji bytes before native compilation
        id: emoji-prepare
        if: inputs.phase == 'full' || contains(fromJSON(inputs.targets), 'font_sources')
        timeout-minutes: 20
        run: cargo xtask fixtures emoji --output "$RUNNER_TEMP/emoji-fonts"
      - name: Save only verified original emoji inputs
        if: github.ref == 'refs/heads/main' && steps.emoji-prepare.outcome == 'success' && steps.emoji-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.emoji-cache.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/emoji-fonts/LICENSE
            ${{ runner.temp }}/emoji-fonts/NotoColorEmoji.ttf
            ${{ runner.temp }}/emoji-fonts/Noto-COLRv1.ttf
      - name: Identify compatible hosted dependency caches
        id: cache-key
        continue-on-error: true
        run: cargo xtask ci cache native --platform '${{ inputs.os }}' --image "$ImageVersion" --phase '${{ inputs.phase }}'
      - name: Restore hosted dependency build artifacts
        id: native-cache
        if: steps.cache-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation') && 'core-' || '' }}${{ steps.cache-key.outputs.primary }}
          restore-keys: |
            ${{ inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation') && steps.cache-key.outputs.primary || '' }}
            ${{ format('checkpoint-{0}-', steps.cache-key.outputs.primary) }}
            ${{ format('checkpoint-{0}', steps.cache-key.outputs.primary) }}
            ${{ steps.cache-key.outputs.legacy }}
            ${{ inputs.phase == 'full' && format('core-{0}', steps.cache-key.outputs.primary) || '' }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
      - name: Remove application outputs from dependency fallback caches
        run: cargo xtask ci cache prune --source "$RUNNER_TEMP/lazypencil-source"
      - name: Identify source-bound application outputs
        id: application-key
        if: steps.cache-key.outcome == 'success'
        continue-on-error: true
        run: cargo xtask ci cache application identify --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Restore source-bound application outputs
        id: application-cache
        if: steps.application-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.primary }}
          restore-keys: |
            ${{ steps.application-key.outputs.checkpoint_prefix }}
            ${{ steps.application-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-application-cache
      - name: Restore unchanged integration-test outputs from a full build
        id: compatible-cache
        if: steps.application-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.compatible_primary }}
          restore-keys: ${{ steps.application-key.outputs.compatible_prefix }}
          path: ${{ runner.temp }}/lazypencil-compatible-cache
          lookup-only: ${{ steps.application-cache.outputs.cache-hit == 'true' }}
      - name: Validate application reuse or keep a fresh build
        id: application-reuse
        if: steps.application-key.outcome == 'success'
        timeout-minutes: 3
        run: cargo xtask ci cache application restore-compatible --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --compatible-directory "$RUNNER_TEMP/lazypencil-compatible-cache" --matched-key '${{ steps.compatible-cache.outputs.cache-matched-key }}' --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Identify release outputs independently of test changes
        id: release-key
        if: steps.cache-key.outcome == 'success' && (inputs.phase == 'full' || inputs.suite == 'release' || inputs.suite == 'candidate' || inputs.measure_tui)
        continue-on-error: true
        run: cargo xtask ci cache application identify --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Restore compatible mapped release outputs
        id: release-cache
        if: steps.release-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.release-key.outputs.primary }}
          restore-keys: |
            ${{ steps.release-key.outputs.checkpoint_prefix }}
            ${{ steps.release-key.outputs.checkpoint_legacy }}
          path: ${{ runner.temp }}/lazypencil-release-cache
          lookup-only: ${{ steps.application-reuse.outputs.release_reused == 'true' }}
      - name: Validate release reuse while keeping verified test outputs
        if: steps.release-key.outcome == 'success' && steps.application-reuse.outputs.release_reused != 'true'
        timeout-minutes: 3
        run: cargo xtask ci cache application restore-or-prune --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Verify distributed dependency notices
        run: cargo xtask ci native notices
      - name: Reproduce script compatibility before native rendering
        if: inputs.phase == 'focus'
        run: cargo xtask ci native focus-core --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Check affected code and build tests with cache-aware ordering
        id: focus-build
        if: inputs.phase == 'focus'
        timeout-minutes: ${{ (inputs.suite == 'core' || inputs.suite == 'conversation') && 21 || 51 }}
        env:
          NATIVE_CACHE_MATCH: ${{ steps.native-cache.outputs.cache-matched-key }}
        run: cargo xtask ci native focus-prepare --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce affected failures before other tests and Chromium
        if: inputs.phase == 'focus'
        run: cargo xtask ci native focus-reproduce --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce changed native clipboard input before longer tests
        id: native-clipboard-focus
        if: inputs.phase == 'focus' && inputs.native_clipboard
        timeout-minutes: 10
        run: cargo xtask ci native clipboard
      - name: Install real Linux terminal emulators for the early reproduction
        if: inputs.phase == 'focus' && inputs.suite == 'candidate' && runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo xtask ci linux-terminal-dependencies
      - name: Reproduce real terminal pixels with the existing focused debug build
        id: terminal-reproduction
        if: inputs.phase == 'focus' && inputs.suite == 'candidate' && runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo xtask terminal --development-build --output "$RUNNER_TEMP/terminal-reproduction"
      - name: Retain early real-terminal reproduction evidence
        if: ${{ always() && (steps.terminal-reproduction.outcome == 'success' || steps.terminal-reproduction.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terminal-reproduction-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-reproduction
          if-no-files-found: error
          retention-days: 3
      - name: Build core test binaries
        if: inputs.phase == 'full'
        timeout-minutes: 40
        run: cargo xtask ci native core-build
      - name: Test core configuration
        id: core-tests
        if: inputs.phase == 'full'
        timeout-minutes: 15
        run: cargo xtask ci native core-test
      - name: Publish failed core evidence before longer checks
        if: failure() && inputs.phase == 'full' && steps.core-tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-failure-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lazypencil-tests.log
            ${{ runner.temp }}/core-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Check all core targets
        if: inputs.phase == 'full'
        timeout-minutes: 15
        run: cargo xtask ci native core-lint
      - name: Build default tests and record executable identities
        id: default-build
        if: inputs.phase == 'full'
        timeout-minutes: 45
        run: cargo xtask ci native default-build
      - name: Reproduce real emoji, TUI and isolated MCP cancellation first
        if: inputs.phase == 'full'
        run: cargo xtask ci native reproduce
      - name: Check all default targets before longer tests and release compilation
        if: inputs.phase == 'full'
        timeout-minutes: 15
        run: cargo xtask ci native default-lint
      - name: Test default configuration alongside release compilation
        if: inputs.phase == 'full'
        timeout-minutes: 60
        run: cargo xtask ci native default-release
      - name: Verify fixture-owned native clipboard images and actual Ctrl+V delivery
        id: native-clipboard
        if: inputs.phase == 'full'
        timeout-minutes: 10
        run: cargo xtask ci native clipboard
      - name: Retain native clipboard and PTY evidence
        if: ${{ always() && (steps.native-clipboard.outcome == 'success' || steps.native-clipboard.outcome == 'failure' || steps.native-clipboard-focus.outcome == 'success' || steps.native-clipboard-focus.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.phase }}-clipboard-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clipboard-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Install and diagnose the verified sandboxed Chromium runtime
        if: inputs.phase == 'full' || inputs.measure_tui || inputs.runtime_parallel || inputs.suite == 'dynamic' || inputs.suite == 'shader' || inputs.suite == 'copy' || inputs.suite == 'browser' || inputs.suite == 'browser-ci' || inputs.suite == 'render' || (inputs.suite == 'candidate' && contains(fromJSON(inputs.targets), 'dynamic_render'))
        timeout-minutes: 15
        run: cargo xtask ci native browser-setup
      - name: Run affected tests and pixel reproductions
        if: inputs.phase == 'focus'
        timeout-minutes: ${{ inputs.suite == 'normal-ci' && 60 || inputs.suite == 'browser-ci' && 25 || 10 }}
        run: cargo xtask ci native focus-test --suite "$FOCUS_SUITE" --targets "$FOCUS_TARGETS"
      - name: Reproduce changed runtime scheduling before the full matrix
        if: inputs.phase == 'focus' && inputs.runtime_parallel
        timeout-minutes: 60
        run: cargo xtask ci native runtime-tests --suite focus
      - name: Verify changed release build recipe before the full matrix
        id: focus-release
        if: inputs.phase == 'focus' && (inputs.suite == 'release' || inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 60
        run: cargo xtask ci native focus-release
      - name: Prepare source-bound original notices for the candidate
        if: inputs.phase == 'focus' && (inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 20
        run: cargo xtask ci native candidate-prepare
      - name: Verify the isolated binary candidate before the full matrix
        if: inputs.phase == 'focus' && (inputs.suite == 'candidate' || inputs.measure_tui)
        timeout-minutes: 10
        run: cargo xtask ci native candidate
      - name: Retain the focused binary candidate and isolated smoke proof
        if: inputs.phase == 'focus' && (inputs.suite == 'candidate' || inputs.measure_tui)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: focus-candidate-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lazypencil-candidate.tar.gz
            ${{ runner.temp }}/candidate-smoke.json
            ${{ runner.temp }}/candidate-smoke.png
          if-no-files-found: error
          retention-days: 3
      - name: Verify independent browser, MCP, lifecycle and Material suites
        if: inputs.phase == 'full'
        timeout-minutes: 60
        run: cargo xtask ci native runtime-tests
      - name: Verify actual Kitty and Sixel window pixels and keyboard operations
        id: terminal-test
        if: inputs.phase == 'focus' && inputs.suite == 'candidate' && runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo xtask terminal --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/terminal-evidence"
      - name: Retain the real-emulator screenshots and source-bound report
        if: ${{ always() && (steps.terminal-test.outcome == 'success' || steps.terminal-test.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terminal-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Measure changed TUI performance code before the full matrix
        id: tui-measurement
        if: inputs.phase == 'focus' && inputs.measure_tui
        timeout-minutes: 15
        run: cargo xtask measure-tui --candidate "$RUNNER_TEMP/lazypencil-candidate.tar.gz" --output "$RUNNER_TEMP/tui-measurement" --chromium-resources --enforce-memory-target
      - name: Retain focused TUI measurements and diagnostic logs
        if: ${{ always() && (steps.tui-measurement.outcome == 'success' || steps.tui-measurement.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tui-measurement-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-measurement
          if-no-files-found: error
          retention-days: 3
      - name: Render the combined example for review
        if: inputs.phase == 'full'
        run: cargo xtask ci native panel
      - name: Recheck release inputs and run isolated smoke tests and measurements
        id: release-smoke
        if: inputs.phase == 'full'
        run: cargo xtask ci native release
      - name: Retain source-bound logs and rendered evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.phase == 'full' && 'verification' || 'focus' }}-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ci-timings.jsonl
            ${{ runner.temp }}/test-executables.json
            ${{ runner.temp }}/default-build.jsonl
            ${{ runner.temp }}/tui-artifacts/
            ${{ runner.temp }}/render-regressions/
            ${{ runner.temp }}/chromium-*.json
            ${{ runner.temp }}/chromium-*.png
            ${{ runner.temp }}/chromium-userns.apparmor
            ${{ runner.temp }}/codec-reference/codec-*
            ${{ runner.temp }}/lazypencil-target/release-*.json
            ${{ runner.temp }}/lazypencil-target/release-*.png
            ${{ runner.temp }}/release-linkage/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage verified application outputs for reuse
        id: application-save
        if: ${{ !cancelled() && inputs.phase == 'focus' && (success() || steps.focus-build.outcome == 'success' && steps.focus-release.outcome == 'success') && steps.application-key.outcome == 'success' && steps.application-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage-focused --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --compatible-directory "$RUNNER_TEMP/lazypencil-compatible-cache" --matched-key '${{ steps.compatible-cache.outputs.cache-matched-key }}' --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Save verified application outputs
        if: ${{ !cancelled() && steps.application-save.outcome == 'success' && steps.application-save.outputs.staged == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.checkpoint }}
          path: ${{ runner.temp }}/lazypencil-application-cache
      - name: Stage mapped release outputs independently of tests
        id: release-save
        if: ${{ success() && steps.release-key.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true' && (steps.release-smoke.outcome == 'success' || steps.focus-release.outcome == 'success') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage --release-only --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-release-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Save the verified release checkpoint
        if: ${{ !cancelled() && steps.release-save.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ inputs.phase == 'full' && steps.release-key.outputs.primary || steps.release-key.outputs.checkpoint }}
          path: ${{ runner.temp }}/lazypencil-release-cache
      - name: Stage a complete build for unchanged integration-test reuse
        id: compatible-save
        if: ${{ success() && inputs.phase == 'full' && steps.application-key.outcome == 'success' && steps.compatible-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        run: cargo xtask ci cache application stage --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-compatible-cache" --native-key '${{ steps.cache-key.outputs.primary }}'
      - name: Save the complete integration-test checkpoint
        id: compatible-published
        if: ${{ !cancelled() && steps.compatible-save.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.application-key.outputs.compatible_primary }}
          path: ${{ runner.temp }}/lazypencil-compatible-cache
      - name: Retire replaced payloads before they evict native dependencies
        if: ${{ !cancelled() && steps.compatible-published.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --platform '${{ inputs.os }}' --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete
      - name: Keep completed dependencies after failure or cancellation
        id: cache-prune
        if: ${{ always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-matched-key != steps.cache-key.outputs.primary && (steps.focus-build.outcome == 'success' || steps.default-build.outcome == 'success') }}
        continue-on-error: true
        run: cargo xtask ci cache prune --source "$RUNNER_TEMP/lazypencil-source"
      - name: Save compatible hosted dependency build artifacts
        if: ${{ always() && steps.cache-prune.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ (inputs.phase == 'full' && steps.release-smoke.outcome == 'success' || inputs.phase == 'focus' && !(inputs.measure_tui || inputs.native_clipboard || inputs.runtime_parallel) && (inputs.suite == 'core' || inputs.suite == 'conversation')) && steps.native-cache.outputs.cache-primary-key || steps.cache-key.outputs.checkpoint }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
