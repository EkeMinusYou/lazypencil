        run: |
          python scripts/ci/application_cache.py stage --source "$RUNNER_TEMP/lazypencil-source" --target "$CARGO_TARGET_DIR" --directory "$RUNNER_TEMP/lazypencil-application-cache" --native-key "$NATIVE_CACHE_KEY"
      - name: Save verified application outputs
        if: ${{ success() && steps.application-save.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
