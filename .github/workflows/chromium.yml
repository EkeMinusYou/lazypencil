name: Chromium integration

on:
  workflow_dispatch:
    inputs:
      os:
        description: Mac release validation; Linux choices are deferred-platform diagnostics
        type: choice
        default: macos-15
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15

permissions:
  contents: read
  actions: read

jobs:
  verify:
    permissions:
      contents: read
      actions: write # Allow the reusable CI's main-only cache retention step.
    uses: ./.github/workflows/ci.yml
    with:
      os: ${{ inputs.os }}
      focus_os: ${{ inputs.os }}
