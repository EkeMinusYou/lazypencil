name: Chromium integration

on:
  workflow_dispatch:
    inputs:
      os:
        description: Hosted platform for real sandboxed Chromium integration
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025

permissions:
  contents: read
  actions: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      os: ${{ inputs.os }}
      focus_os: ${{ inputs.os }}
