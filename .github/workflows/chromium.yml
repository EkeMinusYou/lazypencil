name: Chromium integration

on:
  workflow_dispatch:
    inputs:
      os:
        description: Hosted platform for real sandboxed Chromium integration
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025

permissions:
  contents: read

concurrency:
  group: chromium-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONUTF8: '1'
  LAZYPENCIL_TEST_PYTHON: python

jobs:
  chromium:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.os == 'macos-15-intel' && 120 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select hosted build and isolated user directories
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CARGO_TARGET_DIR={root / 'lazypencil-target'}\n")
              stream.write(f"LAZYPENCIL_CONFIG_DIR={root / 'chromium-test-settings'}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("version=" + os.environ.get("ImageVersion", "unknown") + "\n")
          PY
        id: cache-image
      - name: Install the declared minimum Rust toolchain
        working-directory: ${{ github.workspace }}
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup default 1.94.0
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}
        run: python scripts/ci/linux_dependencies.py
      - name: Restore verified Cargo downloads
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and verify the complete source distribution
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/dist.py source --output source.tar.gz
          python scripts/dist.py verify-source source.tar.gz --extract "$RUNNER_TEMP/lazypencil-source"
      - name: Identify compatible hosted dependency caches
        id: cache-key
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          LAZYPENCIL_CACHE_PLATFORM: ${{ inputs.os }}
          LAZYPENCIL_CACHE_IMAGE: ${{ steps.cache-image.outputs.version }}
        run: python scripts/ci/native_cache.py --platform "$LAZYPENCIL_CACHE_PLATFORM" --image "$LAZYPENCIL_CACHE_IMAGE" --github-output "$GITHUB_OUTPUT"
      - name: Restore dependencies from the normal native verification job
        if: ${{ steps.cache-key.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-key.outputs.primary }}
          restore-keys: ${{ steps.cache-key.outputs.legacy }}
          path: |
            ${{ runner.temp }}/lazypencil-target
            ${{ runner.temp }}/lazypencil-source/vendor/skia-bindings/skia
            ${{ runner.temp }}/lazypencil-material-fonts
      - name: Rebuild application outputs from this source
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          sh scripts/ci/prune_application_cache.sh
          cargo fmt --all -- --check
          cargo build --locked
      - name: Install and verify the pinned Chromium runtime
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          lazypencil_binary="$CARGO_TARGET_DIR/debug/lazypencil"
          if [ "$RUNNER_OS" = Windows ]; then lazypencil_binary="$lazypencil_binary.exe"; fi
          "$lazypencil_binary" --json --data-dir "$RUNNER_TEMP/chromium-test-data" runtime setup chromium > "$RUNNER_TEMP/chromium-setup.json"
          "$lazypencil_binary" --json --data-dir "$RUNNER_TEMP/chromium-test-data" runtime status > "$RUNNER_TEMP/chromium-status.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ["RUNNER_TEMP"]) / "chromium-status.json").read_text(encoding="utf-8"))
          assert status["available"] and status["managed"] and status["integrity_verified"], status
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("LAZYPENCIL_TEST_CHROMIUM=" + status["executable"] + "\n")
          PY
      - name: Permit the verified browser to create its Linux sandbox
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          if [ ! -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] || [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != 1 ]; then
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          status = json.loads((root / "chromium-status.json").read_text(encoding="utf-8"))
          assert status["available"] and status["managed"] and status["integrity_verified"], status
          executable = Path(status["executable"]).resolve(strict=True)
          executable.relative_to(root / "chromium-test-data" / "runtimes" / "chromium")
          assert executable == Path(os.environ["LAZYPENCIL_TEST_CHROMIUM"]).resolve(strict=True)
          assert re.fullmatch(r"/[A-Za-z0-9_./-]+", str(executable)), executable
          policy = 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile lazypencil_ci_chromium "' + str(executable) + '" flags=(unconfined) {\n  userns,\n}\n'
          profile = root / "chromium-userns.apparmor"
          profile.write_text(policy, encoding="utf-8")
          profile.chmod(0o600)
          (root / "chromium-userns-policy.json").write_text(json.dumps({"executable":str(executable),"profile_sha256":hashlib.sha256(policy.encode()).hexdigest(),"kernel_restriction_before":1,"loaded":False}, indent=2) + "\n", encoding="utf-8")
          PY
          sudo -n /usr/sbin/apparmor_parser -r "$RUNNER_TEMP/chromium-userns.apparmor"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "chromium-userns-policy.json"
          data = json.loads(report.read_text(encoding="utf-8"))
          data["kernel_restriction_after"] = int(Path("/proc/sys/kernel/apparmor_restrict_unprivileged_userns").read_text().strip())
          assert data["kernel_restriction_after"] == data["kernel_restriction_before"] == 1
          data["loaded"] = True
          report.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Diagnose Linux browser startup with the OS sandbox enabled
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          ulimit -c 0
          lazypencil_profile="$(mktemp -d)"
          trap 'rm -rf "$lazypencil_profile"' EXIT
          {
            id
            for lazypencil_setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
              if [ -f "$lazypencil_setting" ]; then
                printf '%s: ' "$lazypencil_setting"
                cat "$lazypencil_setting"
              fi
            done
            ldd "$LAZYPENCIL_TEST_CHROMIUM"
          } > "$RUNNER_TEMP/chromium-linux-environment.log" 2>&1
          lazypencil_probe_status=0
          timeout --kill-after=2s 15s "$LAZYPENCIL_TEST_CHROMIUM" --headless --no-first-run --no-default-browser-check --disable-background-networking --user-data-dir="$lazypencil_profile" --dump-dom about:blank > "$RUNNER_TEMP/chromium-startup-dom.log" 2> "$RUNNER_TEMP/chromium-startup-stderr.log" || lazypencil_probe_status=$?
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ["chromium-linux-environment.log", "chromium-startup-stderr.log"]:
              with (root / name).open("rb") as stream:
                  print(name + ":\n" + stream.read(65536).decode("utf-8", errors="replace"))
          PY
          exit "$lazypencil_probe_status"
      - name: Verify captured runtime policy and real page and shader pixels
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          cargo test --locked --lib -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/chromium-unit.log"
          cargo test --locked --no-fail-fast --test runtime --test runtime_config --test scripts -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/chromium-policy.log"
          cargo test --locked --no-fail-fast --test dynamic_render --test browser_readiness --test shader_uniforms --test sampler_sources --test imports -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chromium-render.log"
      - name: Verify failed script source reads and repair
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          cargo test --locked --test mcp failed_script_ -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/chromium-script-source.log"
          cargo test --locked --test mcp cancelling_a_running_script_unblocks_the_mcp_document_worker -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chromium-script-cancel.log"
      - name: Verify real MCP image content
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          cargo test --locked --test mcp real_mcp_shader_assets_uniform_edits_and_browser_refresh_return_image_content -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chromium-mcp.log"
      - name: Verify real MCP idle process cleanup
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          cargo test --locked --test mcp idle_mcp_reaps_script_page_and_shader_processes_without_another_request -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chromium-mcp-idle.log"
      - name: Verify normal and dynamic TUI input pixels and process cleanup
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          set -o pipefail
          cargo test --locked --test tui -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chromium-tui.log"
      - name: Render the combined example for review
        working-directory: ${{ runner.temp }}/lazypencil-source
        run: |
          lazypencil_binary="$CARGO_TARGET_DIR/debug/lazypencil"
          if [ "$RUNNER_OS" = Windows ]; then lazypencil_binary="$lazypencil_binary.exe"; fi
          LAZYPENCIL_CHROMIUM="$LAZYPENCIL_TEST_CHROMIUM" "$lazypencil_binary" --json --data-dir "$RUNNER_TEMP/chromium-test-data" render examples/dynamic-panel.pen --time 0.5 --output "$RUNNER_TEMP/chromium-panel.png" > "$RUNNER_TEMP/chromium-panel.json"
          python - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "chromium-panel.json").read_text(encoding="utf-8"))
          png = (root / "chromium-panel.png").read_bytes()
          assert (report["width"], report["height"]) == (1000, 640), report
          assert report["diagnostics"] == [] and len(report["dynamic_artifacts"]) == 2, report
          assert png[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", png[16:24]) == (1000, 640)
          assert hashlib.sha256(png).hexdigest() == report["png_hash"]
          PY
      - name: Retain runtime identity and integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromium-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromium-*.json
            ${{ runner.temp }}/chromium-*.log
            ${{ runner.temp }}/chromium-panel.png
            ${{ runner.temp }}/chromium-userns.apparmor
          if-no-files-found: ignore
          retention-days: 3
