name: Agent process integration
on:
  workflow_dispatch:
    inputs:
      os:
        description: Mac process validation; Linux choices are deferred-platform diagnostics
        type: choice
        default: macos-15
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
permissions:
  contents: read
concurrency:
  group: process-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  process:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Restore verified Cargo archives
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify and extract complete source
        run: xtask/target/debug/xtask ci native source
      - name: Verify distributed dependency notices
        run: xtask/target/debug/xtask ci native notices
      - name: Reproduce helper startup then verify all core process lifecycles
        run: xtask/target/debug/xtask ci native process
      - name: Retain source-bound process evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: process-${{ inputs.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/process-*.log
            ${{ runner.temp }}/process-report.json
            ${{ runner.temp }}/ci-timings.jsonl
          if-no-files-found: ignore
          retention-days: 3
