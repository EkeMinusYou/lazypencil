name: Refresh Rust notices
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace whose original dependency notices should be collected
        type: choice
        default: tools
        options: [tools, application]
permissions:
  contents: read
concurrency:
  group: tool-notices-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  NOTICE_ROOT: ${{ inputs.workspace == 'application' && '.' || 'xtask' }}
  NOTICE_UPSTREAM: ${{ inputs.workspace == 'application' && 'resources/licenses/rust/upstream.json' || 'xtask/notices/upstream.json' }}
jobs:
  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'false'
      - name: Fetch the locked dependency inventory without native builds
        timeout-minutes: 10
        run: cargo fetch --locked --manifest-path "$NOTICE_ROOT/Cargo.toml"
      - name: Reconstruct notices from checksum-verified original crate archives
        run: cargo xtask notices rust collect --root "$NOTICE_ROOT" --upstream "$NOTICE_UPSTREAM" --output "$RUNNER_TEMP/rust-notices"
      - name: Reverify every notice against the locked original archives
        run: cargo xtask notices rust verify --root "$NOTICE_ROOT" --bundle "$RUNNER_TEMP/rust-notices" --cargo-home "$HOME/.cargo"
      - name: Retain the proposed notices for source review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-notices-${{ inputs.workspace }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-notices
          if-no-files-found: error
          retention-days: 3
