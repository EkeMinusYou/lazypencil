name: Refresh tool workspace Rust notices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tool-notices-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: 'false'
      - name: Fetch the complete locked tool dependency inventory without native builds
        timeout-minutes: 10
        run: cargo fetch --locked --manifest-path xtask/Cargo.toml
      - name: Reconstruct notices from checksum-verified original crate archives
        run: cargo xtask notices rust collect --root xtask --upstream xtask/notices/upstream.json --output "$RUNNER_TEMP/tool-rust-notices"
      - name: Reverify every notice against the locked original archives
        run: cargo xtask notices rust verify --root xtask --bundle "$RUNNER_TEMP/tool-rust-notices" --cargo-home "$HOME/.cargo"
      - name: Retain the proposed notices for source review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tool-rust-notices-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-rust-notices
          if-no-files-found: error
          retention-days: 3
