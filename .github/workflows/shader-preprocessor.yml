name: Isolated shader preprocessing
on:
  workflow_call:
    inputs:
      verify_tools:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      verify_tools:
        description: Verify Rust helpers before the standalone shader check
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  wasm:
    name: Wasm build and source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          verify: ${{ inputs.verify_tools && 'true' || 'false' }}
      - name: Install the standalone Wasm target and original copyright documentation
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-docs --target wasm32-unknown-unknown
      - name: Cache verified component downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-shader-${{ hashFiles('src/shader/preprocessor/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore standalone compiler dependencies
        id: wasm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/lazypencil-wasm-target
          key: shader-wasm-v1-linux-x64-rust1.94.0-${{ hashFiles('src/shader/preprocessor/Cargo.lock', 'src/shader/preprocessor/Cargo.toml', 'src/shader/preprocessor/vendor/**', 'xtask/src/ci/component.rs') }}
          restore-keys: shader-wasm-v1-linux-x64-rust1.94.0-
      - name: Verify the isolated source and locked inputs
        run: xtask/target/debug/xtask ci component source
      - name: Rebuild and check the component
        id: compile
        timeout-minutes: 8
        env:
          EXACT_COMPONENT_CACHE: ${{ steps.wasm-cache.outputs.cache-hit }}
        run: xtask/target/debug/xtask ci component build
      - name: Reproduce macro semantics and memory exhaustion in a JavaScript engine
        timeout-minutes: 2
        run: xtask/target/debug/xtask ci component test
      - name: Collect original package notices
        run: xtask/target/debug/xtask ci component notices
      - name: Collect evidence for the actual Wasm standard-library target
        timeout-minutes: 8
        run: xtask/target/debug/xtask ci component toolchain
      - name: Bind the component and tests to the current source
        run: xtask/target/debug/xtask ci component evidence
      - name: Retain source-bound module and notice evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shader-preprocessor-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shader-preprocessor-evidence
          if-no-files-found: error
          retention-days: 3
      - name: Verify the stored module matches the rebuilt component
        run: xtask/target/debug/xtask ci component verify
      - name: Keep only component dependencies
        id: prune
        if: always() && steps.compile.outcome == 'success'
        run: xtask/target/debug/xtask ci component prune
      - name: Retain compiled dependencies after later regression failures
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.prune.outcome == 'success' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/lazypencil-wasm-target
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
