name: Native build and independent test consumers
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      suite:
        type: string
        required: true
      targets:
        type: string
        required: true
      measure_tui:
        type: boolean
        default: false
      terminal_reproduction:
        type: boolean
        default: false
      rebuild_application:
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  core:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: core
      phase: ${{ (inputs.suite == 'core' || inputs.suite == 'conversation') && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      rebuild_application: ${{ inputs.rebuild_application }}
  release:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: release
      phase: full
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      measure_tui: ${{ inputs.measure_tui }}
      rebuild_application: ${{ inputs.rebuild_application }}
  build:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: build
      phase: ${{ inputs.suite != 'core' && inputs.suite != 'conversation' && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      rebuild_application: ${{ inputs.rebuild_application }}
  runtime:
    if: inputs.os == 'macos-15'
    needs: build
    name: Test runtime from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: runtime
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ needs.build.outputs.runtime_binaries_artifact }}
  normal:
    if: inputs.os == 'macos-15'
    needs: build
    name: Test normal from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: normal
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ needs.build.outputs.binaries_artifact }}
  pixels:
    if: inputs.os == 'macos-15'
    needs: build
    name: Test pixels from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: pixels
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ needs.build.outputs.binaries_artifact }}
  tests:
    # Release completion frees a hosted Mac slot. Its failure must not skip
    # independent tests when the shared build succeeded.
    if: ${{ !cancelled() && inputs.os == 'macos-15' && needs.build.result == 'success' }}
    needs: [build, release]
    # Keep the quiet launch interval and Material checks on one allocation;
    # a sequential matrix would queue for another Mac between its two jobs.
    name: Test terminal and Material from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: short
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ needs.build.outputs.short_binaries_artifact }}
  deferred:
    if: inputs.os != 'macos-15'
    strategy:
      fail-fast: false
      matrix:
        lane: [core, default, release]
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: ${{ matrix.lane }}
      phase: ${{ (matrix.lane == 'core' && (inputs.suite == 'core' || inputs.suite == 'conversation') || matrix.lane == 'default' && inputs.suite != 'core' && inputs.suite != 'conversation') && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      measure_tui: ${{ inputs.measure_tui }}
      terminal_reproduction: ${{ inputs.terminal_reproduction }}
      rebuild_application: ${{ inputs.rebuild_application }}
