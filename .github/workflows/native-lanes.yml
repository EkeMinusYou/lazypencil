name: Native build and independent test consumers
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      suite:
        type: string
        required: true
      targets:
        type: string
        required: true
      measure_tui:
        type: boolean
        default: false
      terminal_reproduction:
        type: boolean
        default: false
      rebuild_application:
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  core:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: core
      phase: ${{ (inputs.suite == 'core' || inputs.suite == 'conversation') && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      rebuild_application: ${{ inputs.rebuild_application }}
  release:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: release
      phase: full
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      measure_tui: ${{ inputs.measure_tui }}
      rebuild_application: ${{ inputs.rebuild_application }}
  build:
    if: inputs.os == 'macos-15'
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: build
      phase: ${{ inputs.suite != 'core' && inputs.suite != 'conversation' && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      rebuild_application: ${{ inputs.rebuild_application }}
  runtime:
    if: inputs.os == 'macos-15'
    needs: build
    name: Test runtime from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: runtime
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ needs.build.outputs.runtime_binaries_artifact }}
  tests:
    if: inputs.os == 'macos-15'
    needs: build
    strategy:
      fail-fast: false
      # Core and release may still own two of the five hosted Mac slots.
      # Keep runtime independent; matrix order does not guarantee priority.
      max-parallel: 2
      matrix:
        suite: [normal, pixels, material, terminal]
    name: Test ${{ matrix.suite }} from the shared build
    uses: ./.github/workflows/native-consumer.yml
    with:
      os: ${{ inputs.os }}
      suite: ${{ matrix.suite }}
      native_tools_artifact: ${{ needs.build.outputs.native_tools_artifact }}
      binaries_artifact: ${{ matrix.suite == 'terminal' && needs.build.outputs.terminal_binaries_artifact || matrix.suite == 'material' && needs.build.outputs.material_binaries_artifact || needs.build.outputs.binaries_artifact }}
  deferred:
    if: inputs.os != 'macos-15'
    strategy:
      fail-fast: false
      matrix:
        lane: [core, default, release]
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ inputs.os }}
      lane: ${{ matrix.lane }}
      phase: ${{ (matrix.lane == 'core' && (inputs.suite == 'core' || inputs.suite == 'conversation') || matrix.lane == 'default' && inputs.suite != 'core' && inputs.suite != 'conversation') && 'verify' || 'full' }}
      suite: ${{ inputs.suite }}
      targets: ${{ inputs.targets }}
      measure_tui: ${{ inputs.measure_tui }}
      terminal_reproduction: ${{ inputs.terminal_reproduction }}
      rebuild_application: ${{ inputs.rebuild_application }}
