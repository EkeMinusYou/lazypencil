name: Native compiled test consumer
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      suite:
        type: string
        required: true
      native_tools_artifact:
        type: string
        required: true
      binaries_artifact:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  consume:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      LAZYPENCIL_CI_TEST_PROFILE: optimized-debug-v1
      CONSUMER_SUITE: ${{ inputs.suite }}
      HEADED_BROWSER_TESTS: ${{ inputs.suite == 'runtime' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
        with:
          prebuilt: ${{ inputs.native_tools_artifact }}
      - name: Verify and normalize the same complete source distribution
        run: xtask/target/debug/xtask ci native source
      - name: Download this run's single compiled catalog
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.binaries_artifact }}
          path: ${{ runner.temp }}/native-binaries
      - name: Restore pinned emoji inputs
        if: inputs.suite == 'pixels'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: emoji-fonts-v1-${{ hashFiles('tests/fixtures/fonts/emoji-upstream.json') }}
          path: |
            ${{ runner.temp }}/emoji-fonts/LICENSE
            ${{ runner.temp }}/emoji-fonts/NotoColorEmoji.ttf
            ${{ runner.temp }}/emoji-fonts/Noto-COLRv1.ttf
      - name: Restore pinned Material inputs independently of Cargo build caches
        if: inputs.suite == 'material' || inputs.suite == 'short'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: material-fonts-v1-${{ hashFiles('resources/icons/catalogue.json') }}
          path: ${{ runner.temp }}/lazypencil-material-fonts
      - name: Prepare the runtime catalog and publish managed browser paths
        if: inputs.suite == 'runtime'
        run: xtask/target/debug/xtask ci native runtime-prepare
      - name: Install Fish for shell completion integration tests
        if: runner.os == 'macOS' && inputs.suite == 'normal'
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install --formula --force-bottle fish
      - name: Run all tests assigned to this consumer
        run: xtask/target/debug/xtask ci native "${CONSUMER_SUITE}-consumer"
      - name: Retain independent source-bound results and all failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-${{ inputs.suite }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/ci-timings.jsonl
            ${{ runner.temp }}/codec-reference/codec-*
            ${{ runner.temp }}/tui-artifacts/
            ${{ runner.temp }}/clipboard-evidence/
            ${{ runner.temp }}/render-regressions/
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - name: Retain the terminal result for the unchanged five-suite gate
        if: always() && inputs.suite == 'short'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-terminal-${{ github.sha }}
          path: ${{ runner.temp }}/terminal-evidence/
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - name: Retain the Material result for the unchanged five-suite gate
        if: always() && inputs.suite == 'short'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-material-${{ github.sha }}
          path: ${{ runner.temp }}/material-evidence/
          overwrite: true
          retention-days: 3
          if-no-files-found: error
