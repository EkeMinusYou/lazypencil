name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Initial release platforms (all preserves the three-platform release gate)
        type: choice
        default: all
        options: [all, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      focus_os:
        description: Override the affected platform for the initial reproduction
        type: choice
        default: auto
        options: [auto, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
  workflow_call:
    inputs:
      os:
        type: string
        default: all
      focus_os:
        type: string
        default: auto

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.os || 'all' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  plan:
    name: Select affected platform and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      platform: ${{ steps.focus.outputs.platform }}
      suite: ${{ steps.focus.outputs.suite }}
      targets: ${{ steps.focus.outputs.targets }}
      preprocessor: ${{ steps.focus.outputs.preprocessor }}
      measure_tui: ${{ steps.focus.outputs.measure_tui }}
      native_clipboard: ${{ steps.focus.outputs.native_clipboard }}
      runtime_parallel: ${{ steps.focus.outputs.runtime_parallel }}
      matrix: ${{ steps.focus.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/xtask
        with:
          verify: 'true'
      - name: Select changes since the last fully verified baseline
        id: focus
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_PLATFORM: ${{ inputs.focus_os || 'auto' }}
          REQUESTED_OS: ${{ inputs.os || 'all' }}
        run: cargo xtask ci plan --platform "$FOCUS_PLATFORM" --matrix "$REQUESTED_OS"
      - name: Verify the stored shader component when its inputs are unchanged
        if: steps.focus.outputs.preprocessor != 'true'
        run: cargo xtask shader

  cache-maintenance:
    name: Reserve dependency cache headroom
    needs: plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
      - name: Identify reusable application inputs without native compilation
        run: cargo xtask ci native source
      - name: Remove application generations that cannot be reused
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --manifest "$RUNNER_TEMP/lazypencil-source/SOURCE-MANIFEST.json" --delete

  audit:
    needs: focus
    if: ${{ !cancelled() && needs.focus.result == 'success' }}
    name: Dependency policy and RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
      - name: Verify checked-in Rust and native reference notices
        run: |
          cargo xtask notices rust verify
          cargo xtask notices skia verify-upstream --upstream resources/licenses/native/upstream.json
          cargo xtask notices toolchain verify-upstream --upstream resources/licenses/toolchain/upstream.json
      - name: Identify the pinned audit tool and compiler
        id: audit-tool-key
        run: |
          rustup toolchain install stable --profile minimal
          cargo xtask ci cache audit identify --directory "$RUNNER_TEMP/lazypencil-audit-tool"
      - name: Restore the pinned audit tool
        id: audit-tool-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.audit-tool-key.outputs.key }}
          path: |
            ${{ runner.temp }}/lazypencil-audit-tool/bin/cargo-deny
            ${{ runner.temp }}/lazypencil-audit-tool/manifest.json
      - name: Verify or install the pinned audit tool
        timeout-minutes: 10
        run: cargo xtask ci cache audit ensure --directory "$RUNNER_TEMP/lazypencil-audit-tool"
      - name: Save the verified audit tool
        if: github.ref == 'refs/heads/main' && steps.audit-tool-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.audit-tool-key.outputs.key }}
          path: |
            ${{ runner.temp }}/lazypencil-audit-tool/bin/cargo-deny
            ${{ runner.temp }}/lazypencil-audit-tool/manifest.json
      - name: Check every feature and platform dependency
        run: |
          cargo deny --all-features --locked check licenses sources advisories
          cargo deny --manifest-path xtask/Cargo.toml --all-features --locked check licenses sources advisories
          cargo deny --manifest-path src/shader/preprocessor/Cargo.toml --all-features --locked check licenses sources advisories
      - name: Compare notices with exact locked registry sources
        run: |
          cargo fetch --locked
          cargo xtask notices rust verify --cargo-home "$HOME/.cargo"
          cargo fetch --locked --manifest-path xtask/Cargo.toml
          cargo xtask notices rust verify --root xtask --bundle xtask/notices --cargo-home "$HOME/.cargo"

  shader-preprocessor:
    name: Check isolated shader preprocessing
    needs: plan
    if: needs.plan.outputs.preprocessor == 'true'
    uses: ./.github/workflows/shader-preprocessor.yml

  focus:
    name: Focused reproduction / ${{ needs.plan.outputs.platform }}
    permissions:
      contents: read
      actions: write
    needs: [plan, cache-maintenance]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.cache-maintenance.result == 'success' || needs.cache-maintenance.result == 'skipped') }}
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ needs.plan.outputs.platform }}
      phase: focus
      suite: ${{ needs.plan.outputs.suite }}
      targets: ${{ needs.plan.outputs.targets }}
      measure_tui: ${{ needs.plan.outputs.measure_tui == 'true' }}
      native_clipboard: ${{ needs.plan.outputs.native_clipboard == 'true' }}
      runtime_parallel: ${{ needs.plan.outputs.runtime_parallel == 'true' }}

  native:
    name: Full verification / ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    needs: [plan, focus, shader-preprocessor]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.focus.result == 'success' && (needs.shader-preprocessor.result == 'success' || needs.shader-preprocessor.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ matrix.os }}
      phase: full
      focused_application: ${{ needs.focus.outputs.application_artifact || '' }}

  source:
    if: ${{ !cancelled() && needs.native.result == 'success' && needs.audit.result == 'success' && (inputs.os == 'all' || inputs.os == '') }}
    name: Verified source artifact
    needs: [native, audit]
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask
      - name: Require all final verification jobs to succeed
        env:
          VERIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: cargo xtask ci gate
      - name: Build and verify the complete source artifact
        run: |
          cargo xtask dist source --output dist/lazypencil-source.tar.gz
          cargo xtask dist verify-source dist/lazypencil-source.tar.gz --extract "$RUNNER_TEMP/cache-source"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lazypencil-source-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove redundant checkpoints after full verification
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci cache retain --manifest "$RUNNER_TEMP/cache-source/SOURCE-MANIFEST.json" --delete
      - name: Attest the fully verified source archive
        id: source-attestation
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/lazypencil-source.tar.gz
          create-storage-record: false
      - name: Verify the source signer workflow and source revision
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci provenance --kind source --artifact "$GITHUB_WORKSPACE/dist/lazypencil-source.tar.gz" --output "$RUNNER_TEMP/source-provenance/verification.json"
      - name: Retain the signed source provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-provenance-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.source-attestation.outputs.bundle-path }}
            ${{ runner.temp }}/source-provenance
          if-no-files-found: error
          retention-days: 3
