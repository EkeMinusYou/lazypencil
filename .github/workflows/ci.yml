name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Initial release platforms (all preserves the three-platform release gate)
        type: choice
        default: all
        options: [all, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      focus_os:
        description: Override the affected platform for the initial reproduction
        type: choice
        default: auto
        options: [auto, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
  workflow_call:
    inputs:
      os:
        type: string
        default: all
      focus_os:
        type: string
        default: auto

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.os || 'all' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: target
  PYTHONUTF8: '1'
  LAZYPENCIL_TEST_PYTHON: python

jobs:
  plan:
    name: Select affected platform and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      platform: ${{ steps.focus.outputs.platform }}
      suite: ${{ steps.focus.outputs.suite }}
      targets: ${{ steps.focus.outputs.targets }}
      preprocessor: ${{ steps.focus.outputs.preprocessor }}
      matrix: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changes since the verified baseline
        id: focus
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_PLATFORM: ${{ inputs.focus_os || 'auto' }}
        run: python3 scripts/ci/focus.py plan --platform "$FOCUS_PLATFORM"
      - name: Verify stored shader component when its inputs are unchanged
        if: steps.focus.outputs.preprocessor != 'true'
        run: python3 scripts/shader_preprocessor.py
      - name: Preserve all final verification platforms by default
        id: matrix
        env:
          REQUESTED_OS: ${{ inputs.os || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os, runpy
          from pathlib import Path
          platforms = runpy.run_path("scripts/ci/focus.py")["PLATFORMS"]
          requested = os.environ["REQUESTED_OS"]
          assert requested == "all" or requested in platforms
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("platforms=" + json.dumps(platforms if requested == "all" else [requested]) + "\n")
          PY

  cache-maintenance:
    name: Reserve dependency cache headroom
    needs: plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Identify current application inputs without compiling
        run: |
          python3 scripts/dist.py source --output "$RUNNER_TEMP/cache-source.tar.gz"
          python3 scripts/dist.py verify-source "$RUNNER_TEMP/cache-source.tar.gz" --extract "$RUNNER_TEMP/cache-source"
      - name: Remove application generations that cannot be reused by this source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cache_retention.py --manifest "$RUNNER_TEMP/cache-source/SOURCE-MANIFEST.json" --delete

  audit:
    needs: focus
    if: ${{ !cancelled() && needs.focus.result == 'success' }}
    name: Dependency policy and RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the checked-in Rust notice inventory
        run: python3 scripts/license_notices.py verify
      - name: Check the pinned native reference terms
        run: python3 scripts/skia_notice_inventory.py verify-upstream --upstream resources/licenses/native/upstream.json
      - name: Check the pinned standard-library package notices
        run: python3 scripts/toolchain_notice_inventory.py verify-upstream --upstream resources/licenses/toolchain/upstream.json
      - name: Identify the pinned audit tool and compiler
        id: audit-tool-key
        run: |
          rustup toolchain install stable --profile minimal
          python3 scripts/ci/audit_tool_cache.py identify --directory "$RUNNER_TEMP/lazypencil-audit-tool" --github-output "$GITHUB_OUTPUT"
      - name: Restore the pinned audit tool binary
        id: audit-tool-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.audit-tool-key.outputs.key }}
          path: |
            ${{ runner.temp }}/lazypencil-audit-tool/bin/cargo-deny
            ${{ runner.temp }}/lazypencil-audit-tool/manifest.json
      - name: Verify or install the pinned audit tool
        id: audit-tool
        timeout-minutes: 10
        run: |
          if ! python3 scripts/ci/audit_tool_cache.py verify --directory "$RUNNER_TEMP/lazypencil-audit-tool"; then
            cargo +stable install cargo-deny --version 0.20.2 --locked --force --root "$RUNNER_TEMP/lazypencil-audit-tool" --target-dir "$RUNNER_TEMP/lazypencil-audit-build"
            python3 scripts/ci/audit_tool_cache.py seal --directory "$RUNNER_TEMP/lazypencil-audit-tool"
          fi
          printf '%s/lazypencil-audit-tool/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Save the verified pinned audit tool binary
        if: github.ref == 'refs/heads/main' && steps.audit-tool-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.audit-tool-key.outputs.key }}
          path: |
            ${{ runner.temp }}/lazypencil-audit-tool/bin/cargo-deny
            ${{ runner.temp }}/lazypencil-audit-tool/manifest.json
      - name: Check all feature and platform dependencies
        run: |
          cargo deny --all-features --locked check licenses sources advisories
          cargo deny --manifest-path src/shader/preprocessor/Cargo.toml --all-features --locked check licenses sources advisories
      - name: Compare notices with locked registry sources
        run: |
          cargo fetch --locked
          python3 scripts/license_notices.py verify --cargo-home "${CARGO_HOME:-$HOME/.cargo}"

  shader-preprocessor:
    name: Check isolated shader preprocessing first
    needs: plan
    if: needs.plan.outputs.preprocessor == 'true'
    uses: ./.github/workflows/shader-preprocessor.yml

  focus:
    name: Focused reproduction / ${{ needs.plan.outputs.platform }}
    needs: [plan, shader-preprocessor, cache-maintenance]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.shader-preprocessor.result == 'success' || needs.shader-preprocessor.result == 'skipped') && (needs.cache-maintenance.result == 'success' || needs.cache-maintenance.result == 'skipped') }}
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ needs.plan.outputs.platform }}
      phase: focus
      suite: ${{ needs.plan.outputs.suite }}
      targets: ${{ needs.plan.outputs.targets }}

  native:
    name: Full verification / ${{ matrix.os }}
    needs: [plan, focus]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.focus.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ matrix.os }}
      phase: full

  source:
    if: ${{ !cancelled() && (inputs.os == 'all' || inputs.os == '') }}
    name: Verified source artifact
    needs: [native, audit]
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require all final verification jobs to succeed
        env:
          VERIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/release_gate.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and verify the source artifact
        run: |
          mkdir -p dist
          python scripts/dist.py source --output dist/lazypencil-source.tar.gz > dist/source-report.json
          python scripts/dist.py verify-source dist/lazypencil-source.tar.gz --extract "$RUNNER_TEMP/cache-source"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lazypencil-source-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove redundant checkpoints after full verification
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cache_retention.py --manifest "$RUNNER_TEMP/cache-source/SOURCE-MANIFEST.json" --delete
